	function file(){
		$.ajax({

			'up':1,
						},

			success:function(msg){
				//隐藏
				document.getElementById("load2").style.display="none";

										var data = msg.text;
					$.each(data, function(i, n){
						var str;
						var alink = '/' + n.id;
						if(n.t ==1){
							alink = n.id;

						}
												str ='<div id=ready><div id=name>&nbsp;<img src=https://images.bakstotre.com/assets/images/filetype/'+ n.icon +'.gif align=absmiddle border=0>&nbsp;<a href=' + alink + ' target=_blank>' + n.name_all + '</a></div><div id=size>'+n.size+'</div><div id=time>'+n.time+'</div></div>';
												if(n.id != '-1'){
							$(str).appendTo("#infos");
						}
					});
					pgs++;
					//少于50条，隐"more"
					if(data.length<50){
						document.getElementById("filemore").style.display="none";
					}
				}else if(msg.zt == '2'){

									}else if(msg.zt == '6'){

					document.getElementById("filemore").style.display="none";
									}else{
					$("#infos").text(msg.info);
				}
			},
			error:function(){

			}
	
	});
}
